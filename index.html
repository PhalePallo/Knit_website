  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            brand: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#0f53d6',
              500: '#3b82f6',
              400: '#60a5fa',
              100: '#dbeafe',
              50: '#eff6ff',
            },
            surface: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
            }
          },
          backgroundImage: {
            'grid-pattern': "linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px)",
          },
          animation: {
            blob: "blob 7s infinite",
            float: "float 6s ease-in-out infinite",
            flow: "flow 1.5s linear infinite",
            'pulse-slow': "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            'fade-up': "fadeUp 0.6s ease-out forwards",
            'scale-in': "scaleIn 0.4s ease-out forwards",
            'drift': "drift 20s ease-in-out infinite",
          },
          keyframes: {
            blob: {
              "0%": { transform: "translate(0px, 0px) scale(1)" },
              "33%": { transform: "translate(30px, -50px) scale(1.1)" },
              "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
              "100%": { transform: "translate(0px, 0px) scale(1)" },
            },
            float: {
              "0%, 100%": { transform: "translateY(0)" },
              "50%": { transform: "translateY(-20px)" },
            },
            flow: {
              "0%": { backgroundPosition: "0 0" },
              "100%": { backgroundPosition: "20px 0" },
            },
            fadeUp: {
              "0%": { opacity: "0", transform: "translateY(24px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
            scaleIn: {
              "0%": { opacity: "0", transform: "scale(0.95)" },
              "100%": { opacity: "1", transform: "scale(1)" },
            },
            drift: {
              "0%, 100%": { transform: "translate(0, 0)" },
              "25%": { transform: "translate(10px, -10px)" },
              "50%": { transform: "translate(-5px, -15px)" },
              "75%": { transform: "translate(-10px, 5px)" },
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-padding-top: 100px;
      /* Ensures sticky header doesn't cover section titles */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .grid-bg {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px), linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
    }

    .terminal-text {
      font-family: 'IBM Plex Mono', monospace;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }

    .bg-flow-gradient {
      background: linear-gradient(90deg, transparent 0%, #94a3b8 50%, transparent 100%);
      background-size: 200% 100%;
    }
  </style>
